<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>PaperWeave / 论织 — 交互原型</title>
  <style>
    :root {
      --bg: #f3f5f2;
      --surface: #ffffff;
      --surface-2: #f8f9f7;
      --surface-3: #eef1ed;
      --ink: #18201d;
      --muted: #68726d;
      --muted-2: #8b948f;
      --line: #dde2de;
      --line-strong: #cbd2cd;
      --accent: #2d5d73;
      --accent-soft: #e8f1f4;
      --accent-strong: #18475f;
      --foundation: #9a6a18;
      --foundation-soft: #f7efd9;
      --frontier: #315e93;
      --frontier-soft: #e7eef7;
      --counter: #9a493f;
      --counter-soft: #f7e8e5;
      --bridge: #6d5b8e;
      --bridge-soft: #eee9f5;
      --resource: #4d7462;
      --resource-soft: #e7f0eb;
      --success: #2c6b4f;
      --success-soft: #e5f1eb;
      --warning: #9a6a18;
      --danger: #a23f3f;
      --shadow-sm: 0 1px 2px rgba(24, 32, 29, .05), 0 8px 24px rgba(24, 32, 29, .04);
      --shadow-md: 0 16px 50px rgba(24, 32, 29, .12);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 18px;
      --sidebar: 232px;
      --topbar: 62px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      height: 100vh;
    }

    .sidebar {
      background: #fbfcfa;
      border-right: 1px solid var(--line);
      padding: 18px 14px 14px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      z-index: 4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 3px 8px 19px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand-name { font-size: 15px; font-weight: 740; letter-spacing: -.01em; }
    .brand-cn { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .nav-label {
      font-size: 10px;
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: .12em;
      padding: 11px 10px 7px;
      font-weight: 700;
    }
    .nav-list { display: grid; gap: 3px; }
    .nav-button {
      width: 100%;
      min-height: 39px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      color: #59635e;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    .nav-button:hover { background: var(--surface-3); color: var(--ink); }
    .nav-button.active { background: #e9ece8; color: var(--ink); font-weight: 670; }
    .nav-button svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .nav-count {
      margin-left: auto;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--surface-3);
      display: grid;
      place-items: center;
      font-size: 10px;
      color: var(--muted);
    }
    .nav-button.active .nav-count { background: white; color: var(--ink); }

    .sidebar-spacer { flex: 1; min-height: 18px; }
    .connection-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 11px;
      box-shadow: var(--shadow-sm);
    }
    .connection-title { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .connection-row { display: flex; align-items: center; gap: 7px; font-size: 11px; margin-top: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    .dot.warning { background: var(--warning); box-shadow: 0 0 0 3px var(--foundation-soft); }
    .connection-row span:last-child { margin-left: auto; color: var(--muted-2); }
    .profile-row {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 13px 7px 2px;
      color: var(--muted);
      font-size: 11px;
    }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: #dfe6e2; display: grid; place-items: center; font-weight: 700; color: #43504a; }
    .profile-row strong { display: block; color: var(--ink); font-size: 12px; }

    .workspace { min-width: 0; display: grid; grid-template-rows: var(--topbar) minmax(0, 1fr); }
    .topbar {
      background: rgba(251,252,250,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 16px;
      z-index: 3;
      min-width: 0;
    }
    .crumb { min-width: 160px; }
    .crumb-title { font-weight: 690; font-size: 13px; }
    .crumb-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .global-search {
      width: min(520px, 48vw);
      margin-left: auto;
      position: relative;
    }
    .global-search svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted-2); }
    .global-search input {
      width: 100%; height: 36px; border: 1px solid var(--line); background: var(--surface);
      border-radius: 9px; padding: 0 84px 0 34px; color: var(--ink); font-size: 12px;
    }
    .search-key { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 1px solid var(--line); background: var(--surface-2); border-radius: 5px; padding: 2px 6px; font-size: 9px; color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 7px; }
    .icon-button {
      height: 34px; min-width: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
      display: grid; place-items: center; cursor: pointer; color: var(--muted);
    }
    .icon-button:hover { color: var(--ink); border-color: var(--line-strong); }
    .icon-button svg { width: 16px; height: 16px; }

    #viewHost { min-width: 0; min-height: 0; overflow: auto; }
    .page { width: min(1390px, 100%); margin: 0 auto; padding: 32px 34px 56px; }

    .demo-banner {
      display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid #d7dfda;
      background: #f8faf7; color: #59635e; border-radius: 9px; font-size: 11px; margin-bottom: 24px;
    }
    .demo-banner svg { width: 15px; height: 15px; flex: none; }
    .demo-banner strong { color: var(--ink); }

    .discover-hero {
      display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(290px, .7fr); gap: 28px; align-items: end;
      margin-bottom: 25px;
    }
    .hero-copy h1 { margin: 0; font-size: clamp(27px, 3vw, 43px); line-height: 1.12; letter-spacing: -.04em; max-width: 760px; font-weight: 760; }
    .hero-copy p { margin: 12px 0 0; max-width: 690px; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .hero-side { display: grid; gap: 7px; align-self: stretch; justify-content: end; align-content: end; }
    .micro-stat { display: flex; align-items: baseline; gap: 8px; justify-content: flex-end; }
    .micro-stat strong { font-size: 22px; letter-spacing: -.03em; }
    .micro-stat span { color: var(--muted); font-size: 11px; }

    .topic-composer {
      border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); border-radius: var(--radius-lg);
      padding: 14px; margin-bottom: 17px;
    }
    .composer-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .topic-input-wrap { position: relative; }
    .topic-input-wrap svg { position: absolute; width: 19px; height: 19px; left: 14px; top: 15px; color: var(--muted); }
    .topic-input {
      width: 100%; min-height: 50px; border: 0; background: var(--surface-2); border-radius: 12px;
      padding: 0 15px 0 44px; font-size: 14px; color: var(--ink);
    }
    .primary-button, .secondary-button, .ghost-button, .danger-button {
      border-radius: 9px; min-height: 36px; padding: 0 14px; border: 1px solid transparent; cursor: pointer; font-size: 12px; font-weight: 650;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
    }
    .primary-button { background: var(--ink); color: white; }
    .primary-button:hover { background: #2b3631; }
    .primary-button svg, .secondary-button svg, .ghost-button svg { width: 15px; height: 15px; }
    .secondary-button { background: var(--surface); border-color: var(--line); color: var(--ink); }
    .secondary-button:hover { border-color: var(--line-strong); background: var(--surface-2); }
    .ghost-button { background: transparent; color: var(--muted); border-color: transparent; padding: 0 8px; }
    .ghost-button:hover { background: var(--surface-3); color: var(--ink); }
    .danger-button { background: var(--counter-soft); color: var(--danger); }
    .small-button { min-height: 28px; padding: 0 9px; font-size: 10px; border-radius: 7px; }

    .composer-controls {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 4px 1px;
    }
    .control-pill {
      border: 1px solid var(--line); border-radius: 999px; background: white; padding: 7px 10px; display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); cursor: pointer;
    }
    .control-pill select { border: 0; background: transparent; color: var(--ink); outline: none; font-size: 10px; }
    .toggle { width: 25px; height: 14px; background: #cbd2ce; border-radius: 999px; padding: 2px; transition: .18s ease; }
    .toggle::after { content: ""; display: block; width: 10px; height: 10px; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: .18s ease; }
    .control-pill.on .toggle { background: var(--accent); }
    .control-pill.on .toggle::after { transform: translateX(11px); }
    .composer-spacer { flex: 1; }

    .suggestions { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 26px; align-items: center; }
    .suggestions > span { font-size: 10px; color: var(--muted); margin-right: 2px; }
    .topic-chip {
      border: 1px solid var(--line); background: rgba(255,255,255,.7); color: #4d5853; border-radius: 999px;
      padding: 6px 10px; font-size: 10px; cursor: pointer;
    }
    .topic-chip:hover, .topic-chip.active { border-color: #aeb9b3; background: white; color: var(--ink); }

    .pack-header { display: flex; align-items: flex-start; gap: 18px; margin: 5px 0 16px; }
    .pack-header h2 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .pack-header p { margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; max-width: 810px; }
    .pack-actions { margin-left: auto; display: flex; gap: 7px; }
    .scope-line { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .scope-tag { border-radius: 6px; background: var(--surface-3); color: #59635e; padding: 4px 7px; font-size: 9px; }

    .role-legend { display: flex; align-items: center; gap: 14px; padding: 10px 0 15px; border-top: 1px solid var(--line); }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
    .legend-swatch { width: 8px; height: 8px; border-radius: 2px; }
    .legend-swatch.foundation { background: var(--foundation); }
    .legend-swatch.frontier { background: var(--frontier); }
    .legend-swatch.counterpoint { background: var(--counter); }
    .legend-note { margin-left: auto; font-size: 10px; color: var(--muted-2); }

    .paper-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .role-column { min-width: 0; }
    .role-column-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 9px; }
    .role-column-head h3 { margin: 0; font-size: 12px; }
    .role-column-head span { color: var(--muted); font-size: 9px; }
    .role-column-head .count { margin-left: auto; border-radius: 99px; padding: 3px 6px; background: var(--surface-3); color: var(--muted); }
    .paper-stack { display: grid; gap: 10px; }

    .paper-card {
      position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 13px; padding: 13px;
      cursor: pointer; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease; overflow: hidden;
    }
    .paper-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--role-color); opacity: .86; }
    .paper-card:hover { transform: translateY(-1px); border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
    .paper-card.foundation { --role-color: var(--foundation); }
    .paper-card.frontier { --role-color: var(--frontier); }
    .paper-card.counterpoint { --role-color: var(--counter); }
    .paper-card.bridge { --role-color: var(--bridge); }
    .paper-card.resource { --role-color: var(--resource); }
    .paper-topline { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
    .role-badge { border-radius: 5px; padding: 4px 6px; font-size: 8px; font-weight: 760; text-transform: uppercase; letter-spacing: .05em; }
    .foundation .role-badge { background: var(--foundation-soft); color: var(--foundation); }
    .frontier .role-badge { background: var(--frontier-soft); color: var(--frontier); }
    .counterpoint .role-badge { background: var(--counter-soft); color: var(--counter); }
    .bridge .role-badge { background: var(--bridge-soft); color: var(--bridge); }
    .resource .role-badge { background: var(--resource-soft); color: var(--resource); }
    .confidence { font-size: 8px; color: var(--muted-2); }
    .pin { margin-left: auto; width: 24px; height: 24px; border: 0; background: transparent; border-radius: 6px; color: var(--muted-2); display: grid; place-items: center; cursor: pointer; }
    .pin:hover, .pin.pinned { color: var(--accent); background: var(--accent-soft); }
    .pin svg { width: 13px; height: 13px; }
    .paper-title { font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 14px; line-height: 1.35; margin: 0 0 6px; }
    .paper-meta { color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reason { margin: 10px 0; padding: 8px 9px; border-radius: 8px; background: var(--surface-2); color: #4d5853; font-size: 10px; line-height: 1.55; }
    .reason strong { color: var(--ink); }
    .paper-status { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .status-mini { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; color: var(--muted); }
    .status-mini svg { width: 11px; height: 11px; }
    .paper-card-actions { display: flex; gap: 4px; margin-left: auto; }
    .text-action { border: 0; background: transparent; color: var(--muted); font-size: 9px; cursor: pointer; padding: 4px 5px; border-radius: 5px; }
    .text-action:hover { background: var(--surface-3); color: var(--ink); }

    .supplement-rail { margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .supplement-card {
      border: 1px dashed var(--line-strong); border-radius: 12px; background: rgba(255,255,255,.48); padding: 11px 12px; display: flex; align-items: center; gap: 11px; cursor: pointer;
    }
    .supplement-card:hover { background: white; }
    .supplement-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; }
    .supplement-icon.bridge { background: var(--bridge-soft); color: var(--bridge); }
    .supplement-icon.resource { background: var(--resource-soft); color: var(--resource); }
    .supplement-icon svg { width: 16px; height: 16px; }
    .supplement-card strong { font-family: Georgia, serif; font-size: 12px; display: block; }
    .supplement-card span { font-size: 9px; color: var(--muted); display: block; margin-top: 3px; }
    .supplement-card .arrow { margin-left: auto; color: var(--muted); }

    .section-heading { display: flex; align-items: end; gap: 14px; margin-bottom: 18px; }
    .section-heading h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; }
    .section-heading p { margin: 5px 0 0; font-size: 11px; color: var(--muted); }
    .section-heading .actions { margin-left: auto; display: flex; gap: 7px; }

    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; margin-bottom: 20px; }
    .metric-card { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 13px; }
    .metric-card span { font-size: 9px; color: var(--muted); }
    .metric-card strong { display: block; margin-top: 7px; font-size: 21px; letter-spacing: -.03em; }
    .metric-card small { display: block; margin-top: 5px; font-size: 9px; color: var(--muted-2); }

    .table-shell { border: 1px solid var(--line); border-radius: 13px; background: var(--surface); overflow: hidden; }
    .table-toolbar { min-height: 48px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
    .filter-button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; height: 29px; padding: 0 9px; font-size: 9px; color: var(--muted); cursor: pointer; }
    .filter-button.active { background: var(--surface-3); color: var(--ink); }
    .table-search { margin-left: auto; width: 230px; height: 29px; border: 1px solid var(--line); border-radius: 7px; padding: 0 9px; font-size: 9px; }
    table { width: 100%; border-collapse: collapse; }
    th { height: 36px; text-align: left; color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .07em; background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 0 12px; }
    td { border-bottom: 1px solid var(--line); padding: 11px 12px; font-size: 10px; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #fafbf9; }
    .title-cell strong { display: block; font-family: Georgia, serif; font-size: 12px; max-width: 490px; }
    .title-cell span { color: var(--muted); font-size: 9px; display: block; margin-top: 3px; }
    .state-badge { padding: 4px 6px; border-radius: 5px; font-size: 8px; background: var(--surface-3); color: var(--muted); }
    .state-badge.verified { background: var(--success-soft); color: var(--success); }
    .state-badge.reading { background: var(--accent-soft); color: var(--accent); }
    .state-badge.queued { background: var(--foundation-soft); color: var(--foundation); }

    .knowledge-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(270px, .55fr); gap: 15px; }
    .panel { border: 1px solid var(--line); background: var(--surface); border-radius: 13px; overflow: hidden; }
    .panel-head { padding: 13px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .panel-head strong { font-size: 12px; }
    .panel-head span { font-size: 9px; color: var(--muted); }
    .panel-head .right { margin-left: auto; }
    .matrix-wrap { overflow: auto; }
    .matrix-table th:first-child, .matrix-table td:first-child { position: sticky; left: 0; background: white; z-index: 1; min-width: 280px; }
    .matrix-table th { min-width: 110px; }
    .stance { display: inline-flex; align-items: center; gap: 5px; font-size: 8px; font-weight: 690; }
    .stance::before { content: ""; width: 7px; height: 7px; border-radius: 2px; }
    .stance.support { color: var(--success); }
    .stance.support::before { background: var(--success); }
    .stance.counter { color: var(--counter); }
    .stance.counter::before { background: var(--counter); }
    .stance.qualify { color: var(--warning); }
    .stance.qualify::before { background: var(--warning); }
    .stance.incomparable { color: var(--muted); }
    .stance.incomparable::before { border: 1px solid var(--muted); background: transparent; }
    .insight-list { padding: 4px 14px 14px; }
    .insight-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .insight-item:last-child { border-bottom: 0; }
    .insight-item small { color: var(--muted-2); font-size: 8px; text-transform: uppercase; letter-spacing: .06em; }
    .insight-item strong { display: block; font-size: 11px; margin-top: 5px; line-height: 1.45; }
    .insight-item p { margin: 5px 0 0; font-size: 9px; color: var(--muted); line-height: 1.55; }

    .sync-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 17px; }
    .sync-card { border: 1px solid var(--line); background: var(--surface); border-radius: 13px; padding: 14px; }
    .sync-card-head { display: flex; align-items: center; gap: 9px; }
    .service-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-3); display: grid; place-items: center; }
    .service-mark svg { width: 17px; height: 17px; }
    .sync-card-head strong { display: block; font-size: 12px; }
    .sync-card-head span { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; }
    .sync-state { margin-left: auto; font-size: 8px; color: var(--success); background: var(--success-soft); padding: 4px 6px; border-radius: 5px; }
    .sync-card-body { margin: 13px 0; display: grid; gap: 7px; }
    .sync-detail { display: flex; font-size: 9px; color: var(--muted); }
    .sync-detail span:last-child { margin-left: auto; color: var(--ink); }
    .sync-card-actions { display: flex; gap: 7px; }
    .activity-list { padding: 0 14px; }
    .activity-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .activity-row:last-child { border-bottom: 0; }
    .activity-icon { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--success-soft); color: var(--success); }
    .activity-icon svg { width: 12px; height: 12px; }
    .activity-row strong { font-size: 10px; display: block; }
    .activity-row p { margin: 3px 0 0; font-size: 9px; color: var(--muted); }
    .activity-row time { font-size: 8px; color: var(--muted-2); }

    .settings-layout { display: grid; grid-template-columns: 190px minmax(0, 760px); gap: 24px; }
    .settings-nav { display: grid; gap: 4px; align-content: start; }
    .settings-nav button { border: 0; background: transparent; text-align: left; border-radius: 7px; height: 34px; padding: 0 9px; color: var(--muted); font-size: 10px; cursor: pointer; }
    .settings-nav button.active { background: var(--surface-3); color: var(--ink); font-weight: 650; }
    .settings-section { border: 1px solid var(--line); background: var(--surface); border-radius: 13px; overflow: hidden; }
    .settings-section-head { padding: 15px 16px; border-bottom: 1px solid var(--line); }
    .settings-section-head h2 { margin: 0; font-size: 15px; }
    .settings-section-head p { margin: 5px 0 0; color: var(--muted); font-size: 9px; }
    .settings-body { padding: 15px 16px; display: grid; gap: 14px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 9px; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 36px; padding: 8px 10px; color: var(--ink); font-size: 10px;
    }
    .field textarea { min-height: 78px; resize: vertical; }
    .field-note { font-size: 8px; color: var(--muted-2); line-height: 1.5; }
    .setting-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row strong { font-size: 10px; display: block; }
    .setting-row span { font-size: 8px; color: var(--muted); display: block; margin-top: 3px; }
    .switch { margin-left: auto; width: 34px; height: 19px; border: 0; border-radius: 99px; padding: 3px; background: #c7cfca; cursor: pointer; }
    .switch::after { content: ""; width: 13px; height: 13px; border-radius: 50%; background: white; display: block; transition: .16s ease; }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(15px); }

    /* Reader */
    .reader-shell { height: 100%; min-height: 0; display: grid; grid-template-rows: 50px minmax(0, 1fr); background: #e9ece9; overflow: hidden; }
    .reader-toolbar { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 12px; min-width: 0; }
    .reader-title { min-width: 0; margin-right: auto; }
    .reader-title strong { display: block; font-family: Georgia, serif; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 510px; }
    .reader-title span { display: block; color: var(--muted); font-size: 8px; margin-top: 2px; }
    .tool-divider { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
    .toolbar-state { height: 28px; border: 1px solid var(--line); border-radius: 7px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 8px; color: var(--muted); background: var(--surface-2); }
    .toolbar-state .dot { width: 6px; height: 6px; box-shadow: none; }
    .reader-grid { display: grid; grid-template-columns: 210px minmax(430px, 1fr) 376px; min-height: 0; }
    .reader-left, .research-panel { background: var(--surface); min-height: 0; overflow: hidden; }
    .reader-left { border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .left-tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; }
    .left-tabs button { flex: 1; height: 38px; border: 0; background: transparent; font-size: 8px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .left-tabs button.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 650; }
    .outline { overflow: auto; padding: 10px 8px 20px; }
    .outline-item { width: 100%; border: 0; background: transparent; border-radius: 7px; text-align: left; padding: 8px 8px; font-size: 9px; color: var(--muted); cursor: pointer; display: flex; gap: 7px; align-items: baseline; }
    .outline-item:hover, .outline-item.active { background: var(--surface-3); color: var(--ink); }
    .outline-item .page-num { margin-left: auto; font-size: 8px; color: var(--muted-2); }
    .outline-item.level-2 { padding-left: 19px; }
    .topic-context { margin: 10px 8px; padding: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; }
    .topic-context small { font-size: 7px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted-2); }
    .topic-context strong { display: block; font-size: 9px; margin-top: 5px; line-height: 1.4; }
    .topic-context p { margin: 5px 0 0; color: var(--muted); font-size: 8px; line-height: 1.45; }

    .pdf-stage { min-width: 0; min-height: 0; overflow: auto; padding: 26px 32px 60px; scroll-behavior: smooth; background: #e5e8e5; }
    .pdf-page {
      width: min(760px, 100%); min-height: 980px; margin: 0 auto 22px; background: white; box-shadow: 0 3px 13px rgba(26,32,29,.13);
      padding: 58px 64px 64px; font-family: Georgia, "Times New Roman", serif; color: #202522; position: relative;
    }
    .pdf-page-number { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 9px; color: #777; }
    .paper-headline { text-align: center; margin: 10px auto 20px; font-size: 25px; line-height: 1.2; letter-spacing: -.02em; max-width: 620px; }
    .paper-authors { text-align: center; font-size: 10px; color: #4c534f; line-height: 1.5; }
    .paper-affiliation { text-align: center; font-size: 8px; color: #777; margin-top: 5px; }
    .abstract-box { margin: 30px auto 24px; max-width: 585px; }
    .abstract-box h4 { text-align: center; font-size: 11px; margin: 0 0 8px; }
    .abstract-box p, .pdf-copy p { font-size: 10.5px; line-height: 1.62; text-align: justify; margin: 0 0 11px; }
    .pdf-columns { columns: 2; column-gap: 31px; column-rule: 1px solid #efefef; }
    .pdf-copy h2 { column-span: none; font-size: 13px; margin: 15px 0 7px; }
    .pdf-copy h3 { font-size: 11px; margin: 13px 0 6px; }
    .evidence-source { background: linear-gradient(transparent 15%, #fff2b8 15%, #fff2b8 89%, transparent 89%); cursor: pointer; border-radius: 2px; }
    .evidence-source.flash { animation: anchorFlash 1.35s ease; }
    @keyframes anchorFlash { 0%,100% { background-color: transparent; } 35% { background-color: #f7d965; } }
    .paper-figure { break-inside: avoid; margin: 14px 0; border: 1px solid #aaa; padding: 8px; }
    .figure-diagram { height: 120px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: center; }
    .figure-node { border: 1px solid #777; border-radius: 3px; padding: 10px 5px; text-align: center; font-family: ui-sans-serif, sans-serif; font-size: 8px; position: relative; }
    .figure-node:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); }
    .figure-caption { font-size: 8px; line-height: 1.45; margin-top: 6px; }
    .paper-table { width: 100%; margin: 12px 0 5px; border-collapse: collapse; font-size: 8px; break-inside: avoid; }
    .paper-table th, .paper-table td { border: 1px solid #8c8c8c; height: auto; padding: 4px; background: white; color: #222; font-size: 8px; }
    .paper-table caption { caption-side: bottom; text-align: left; padding-top: 5px; line-height: 1.4; }
    .formula { text-align: center; font-family: "Times New Roman", serif; font-style: italic; margin: 13px 0; font-size: 12px; }

    .research-panel { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .research-tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--line); min-width: 0; }
    .research-tabs button { height: 41px; padding: 0 9px; border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .research-tabs button.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 680; }
    .tab-count { display: inline-grid; place-items: center; min-width: 16px; height: 16px; margin-left: 3px; padding: 0 4px; border-radius: 99px; background: var(--counter-soft); color: var(--counter); font-size: 7px; }
    .research-content { overflow: auto; padding: 13px 13px 24px; }
    .panel-intro { margin-bottom: 13px; }
    .panel-intro small { color: var(--muted-2); font-size: 7px; text-transform: uppercase; letter-spacing: .08em; }
    .panel-intro h3 { margin: 6px 0 4px; font-size: 14px; letter-spacing: -.02em; }
    .panel-intro p { margin: 0; font-size: 9px; color: var(--muted); line-height: 1.55; }
    .guide-card { border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 9px; background: var(--surface); }
    .guide-card-head { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .guide-icon { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
    .guide-icon svg { width: 13px; height: 13px; }
    .guide-card strong { font-size: 10px; }
    .guide-card p { font-size: 9px; color: var(--muted); line-height: 1.55; margin: 0; }
    .guide-list { display: grid; gap: 6px; }
    .guide-step { border: 0; background: var(--surface-2); border-radius: 7px; padding: 8px; cursor: pointer; text-align: left; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 7px; }
    .guide-step:hover { background: var(--surface-3); }
    .step-num { width: 20px; height: 20px; border-radius: 6px; background: white; border: 1px solid var(--line); display: grid; place-items: center; font-size: 8px; }
    .guide-step strong { font-size: 9px; display: block; }
    .guide-step span { font-size: 8px; color: var(--muted); display: block; margin-top: 2px; line-height: 1.4; }
    .question-list { display: grid; gap: 6px; }
    .question-item { display: grid; grid-template-columns: 13px minmax(0,1fr); gap: 6px; font-size: 9px; line-height: 1.5; color: #46504b; }
    .question-item::before { content: "?"; width: 13px; height: 13px; border-radius: 50%; background: var(--foundation-soft); color: var(--foundation); display: grid; place-items: center; font-size: 7px; font-weight: 800; margin-top: 1px; }

    .review-summary { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); padding: 9px; border-radius: 9px; margin-bottom: 10px; }
    .review-summary strong { font-size: 10px; }
    .review-summary span { font-size: 8px; color: var(--muted); }
    .review-progress { margin-left: auto; font-size: 8px; color: var(--success); }
    .claim-card { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px; margin-bottom: 9px; transition: opacity .15s ease; }
    .claim-card.rejected { opacity: .55; }
    .claim-card.accepted { border-color: #bcd3c7; background: #fbfdfc; }
    .claim-head { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
    .epistemic { font-size: 7px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .draft-badge { padding: 3px 5px; border-radius: 4px; font-size: 7px; margin-left: auto; background: var(--foundation-soft); color: var(--foundation); }
    .draft-badge.accepted { background: var(--success-soft); color: var(--success); }
    .draft-badge.rejected { background: var(--counter-soft); color: var(--counter); }
    .claim-text { font-size: 10px; line-height: 1.55; margin: 0 0 7px; }
    .claim-editor { width: 100%; min-height: 72px; border: 1px solid var(--line); border-radius: 7px; padding: 8px; font-size: 9px; line-height: 1.5; resize: vertical; }
    .anchor-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px; }
    .anchor-chip { border: 1px solid #d4dcd7; background: var(--surface-2); color: var(--accent); border-radius: 5px; padding: 4px 6px; font-size: 7px; cursor: pointer; }
    .anchor-chip:hover { background: var(--accent-soft); }
    .scope-note { font-size: 8px; line-height: 1.45; color: var(--muted); padding: 6px 7px; background: var(--surface-2); border-radius: 6px; margin-bottom: 8px; }
    .claim-actions { display: flex; gap: 5px; }
    .claim-actions button { border: 1px solid var(--line); background: white; border-radius: 6px; height: 27px; padding: 0 8px; font-size: 8px; cursor: pointer; }
    .claim-actions button:hover { background: var(--surface-3); }
    .claim-actions button.accept { color: var(--success); }
    .claim-actions button.reject { color: var(--counter); }
    .claim-actions .spacer { flex: 1; }

    .notes-editor { width: 100%; min-height: 330px; border: 0; background: transparent; resize: none; color: var(--ink); font-size: 10px; line-height: 1.65; outline: none; }
    .editor-toolbar { display: flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px; margin-bottom: 8px; }
    .editor-toolbar button { width: 26px; height: 25px; border: 0; background: transparent; border-radius: 5px; font-size: 9px; cursor: pointer; color: var(--muted); }
    .editor-toolbar button:hover { background: white; color: var(--ink); }
    .autosave { font-size: 7px; color: var(--muted-2); margin-left: auto; padding-right: 4px; }

    .chat-history { display: grid; gap: 9px; margin-bottom: 12px; }
    .chat-message { border-radius: 9px; padding: 9px 10px; font-size: 9px; line-height: 1.55; }
    .chat-message.user { margin-left: 38px; background: var(--accent-soft); color: #274553; }
    .chat-message.ai { margin-right: 18px; background: var(--surface-2); border: 1px solid var(--line); }
    .chat-citations { display: flex; gap: 5px; margin-top: 7px; }
    .suggested-questions { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .suggested-questions button { border: 1px solid var(--line); background: white; color: var(--muted); border-radius: 7px; padding: 6px 7px; font-size: 8px; cursor: pointer; text-align: left; }
    .suggested-questions button:hover { color: var(--ink); background: var(--surface-2); }
    .ask-box { border: 1px solid var(--line); border-radius: 10px; padding: 7px; background: white; }
    .ask-box textarea { width: 100%; border: 0; resize: none; min-height: 58px; outline: none; font-size: 9px; line-height: 1.5; }
    .ask-actions { display: flex; align-items: center; }
    .scope-select { border: 0; background: transparent; font-size: 8px; color: var(--muted); }
    .ask-actions button { margin-left: auto; }

    /* Modal, palette, toast */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(25,32,29,.38); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 30; padding: 24px; }
    .modal { width: min(720px, 100%); max-height: min(780px, calc(100vh - 48px)); overflow: auto; border-radius: 15px; background: white; box-shadow: var(--shadow-md); border: 1px solid rgba(255,255,255,.4); }
    .modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 17px 18px 14px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 16px; }
    .modal-head p { margin: 4px 0 0; font-size: 9px; color: var(--muted); }
    .modal-head button { margin-left: auto; }
    .modal-body { padding: 16px 18px; }
    .modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 7px; }
    .sync-plan { display: grid; gap: 10px; }
    .plan-group { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .plan-group-head { display: flex; align-items: center; gap: 8px; padding: 10px 11px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
    .plan-group-head > svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .plan-group-head strong { font-size: 10px; }
    .plan-group-head span { margin-left: auto; font-size: 8px; color: var(--muted); }
    .plan-row { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-bottom: 1px solid var(--line); font-size: 9px; }
    .plan-row:last-child { border-bottom: 0; }
    .plan-row svg { width: 13px; height: 13px; color: var(--success); flex: none; margin-top: 1px; }
    .plan-row strong { display: block; }
    .plan-row span { display: block; color: var(--muted); font-size: 8px; margin-top: 2px; }
    .diff-box { background: #202722; color: #dfe8e2; border-radius: 8px; padding: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 8px; line-height: 1.55; white-space: pre-wrap; }
    .diff-add { color: #96d6ad; }

    .command-backdrop { position: fixed; inset: 0; background: rgba(25,32,29,.25); z-index: 40; display: grid; align-items: start; justify-items: center; padding-top: 12vh; }
    .command-palette { width: min(600px, calc(100vw - 28px)); border: 1px solid var(--line); background: white; border-radius: 13px; box-shadow: var(--shadow-md); overflow: hidden; }
    .command-input { height: 48px; border: 0; border-bottom: 1px solid var(--line); width: 100%; padding: 0 15px; outline: none; font-size: 12px; }
    .command-results { padding: 7px; max-height: 360px; overflow: auto; }
    .command-item { width: 100%; border: 0; background: transparent; display: flex; align-items: center; gap: 9px; border-radius: 8px; min-height: 39px; padding: 0 9px; cursor: pointer; text-align: left; }
    .command-item:hover, .command-item.active { background: var(--surface-3); }
    .command-item svg { width: 15px; height: 15px; color: var(--muted); }
    .command-item strong { font-size: 10px; display: block; }
    .command-item span { font-size: 8px; color: var(--muted); display: block; margin-top: 2px; }
    .command-item kbd { margin-left: auto; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; font-size: 7px; color: var(--muted); }

    #toastStack { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: grid; gap: 8px; }
    .toast { min-width: 260px; max-width: 390px; border: 1px solid var(--line); background: white; box-shadow: var(--shadow-md); border-radius: 10px; padding: 10px 11px; display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 8px; animation: toastIn .22s ease; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
    .toast-icon { width: 20px; height: 20px; border-radius: 6px; background: var(--success-soft); color: var(--success); display: grid; place-items: center; }
    .toast-icon svg { width: 12px; height: 12px; }
    .toast strong { font-size: 10px; display: block; }
    .toast span { font-size: 8px; color: var(--muted); display: block; margin-top: 3px; line-height: 1.45; }

    .empty-state { text-align: center; padding: 70px 20px; color: var(--muted); }
    .empty-icon { width: 44px; height: 44px; border-radius: 13px; margin: 0 auto 12px; background: var(--surface-3); display: grid; place-items: center; }
    .empty-icon svg { width: 20px; height: 20px; }
    .empty-state h3 { color: var(--ink); margin: 0 0 6px; font-size: 14px; }
    .empty-state p { margin: 0 auto 14px; font-size: 9px; max-width: 380px; line-height: 1.55; }

    .loading-pack { border: 1px solid var(--line); border-radius: 14px; background: white; padding: 24px; }
    .loading-steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
    .loading-step { min-height: 76px; border: 1px solid var(--line); border-radius: 9px; padding: 9px; color: var(--muted); font-size: 8px; position: relative; overflow: hidden; }
    .loading-step strong { display: block; color: var(--ink); font-size: 9px; margin-top: 6px; }
    .loading-step.done::before, .loading-step.active::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(45,93,115,.08), transparent); animation: sweep 1.1s infinite; }
    .loading-step.done { background: var(--success-soft); border-color: #c9ddd2; }
    .loading-step.active { border-color: #b7cbd4; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    @media (max-width: 1160px) {
      :root { --sidebar: 72px; }
      .brand > div:last-child, .nav-button span:not(.nav-count), .nav-label, .connection-card, .profile-row > div:last-child { display: none; }
      .brand { justify-content: center; padding-left: 0; padding-right: 0; }
      .nav-button { justify-content: center; padding: 0; position: relative; }
      .nav-count { position: absolute; right: 5px; top: 3px; }
      .profile-row { justify-content: center; padding-left: 0; padding-right: 0; }
      .reader-grid { grid-template-columns: 54px minmax(420px,1fr) 340px; }
      .reader-left .left-tabs, .reader-left .outline-item span:not(.page-num), .reader-left .topic-context { display: none; }
      .outline-item { justify-content: center; padding: 8px 2px; }
      .outline-item .page-num { margin: 0; }
    }

    @media (max-width: 900px) {
      .paper-grid { grid-template-columns: 1fr; }
      .discover-hero { grid-template-columns: 1fr; }
      .hero-side { display: none; }
      .metric-grid { grid-template-columns: repeat(2, 1fr); }
      .sync-grid { grid-template-columns: 1fr; }
      .knowledge-layout { grid-template-columns: 1fr; }
      .reader-grid { grid-template-columns: minmax(0,1fr) 330px; }
      .reader-left { display: none; }
      .global-search { display: none; }
    }

    @media (max-width: 700px) {
      :root { --sidebar: 0px; }
      .app-shell { grid-template-columns: minmax(0, 1fr); }
      .workspace { grid-column: 1; min-width: 0; }
      .sidebar { display: none; }
      .topbar { padding: 0 12px; }
      .page { padding: 22px 15px 44px; }
      .crumb { min-width: 0; }
      .top-actions { margin-left: auto; }
      .composer-main { grid-template-columns: 1fr; }
      .pack-header { flex-direction: column; gap: 12px; }

    function findPaper(id) {
      for (const theme of Object.values(THEMES)) {
        const p = Object.values(theme.papers).flat().find(x => x.id === id);
        if (p) return { paper:p, theme };
      }
      return null;
    }

    function roleOfPaper(id, theme = THEMES[state.themeKey]) {
      return Object.keys(theme.papers).find(role => theme.papers[role].some(p => p.id === id)) || 'foundation';
    }

    function currentTheme() { return THEMES[state.themeKey]; }

    function navCount(key) {
      if (key === 'library') return 18;
      if (key === 'reading') return 3;
      if (key === 'knowledge') return 12;
      if (key === 'sync') return state.syncCompleted ? 0 : 2;
      return null;
    }

    function renderNav() {
      document.getElementById('mainNav').innerHTML = navItems.map(([key,label,icon]) => {
        const active = state.view === key || (state.view === 'reader' && key === 'reading');
        const count = navCount(key);
        return `<button class="nav-button ${active?'active':''}" data-action="nav" data-view="${key}" aria-current="${active?'page':'false'}">${icon}<span>${label}</span>${count!==null?`<span class="nav-count">${count}</span>`:''}</button>`;

      ];
      return generic;

    function paperPages(paper,theme) {
      const counter = roleOfPaper(paper.id,theme)==='counterpoint';
      return `<article class="pdf-page"><h1 class="paper-headline">${esc(paper.title)}</h1><div class="paper-authors">${esc(paper.authors)}</div><div class="paper-affiliation">Interactive prototype paper view · demo text, not the original publication</div>
        <section class="abstract-box" id="anchor-abstract"><h4>Abstract</h4><p><span class="evidence-source">We investigate how claims about ${esc(theme.short)} depend on the relationship between an underlying capability and the metric used to observe it.</span> Using controlled comparisons and re-analysis, the paper separates direct empirical observations from interpretations about qualitative transitions. The results motivate a more careful treatment of measurement, scale, and uncertainty.</p></section>
        <div class="pdf-columns pdf-copy"><section id="anchor-intro"><h2>1&nbsp;&nbsp;Introduction</h2><p>Large models often exhibit performance changes that attract strong interpretations. Yet a plotted discontinuity can reflect a change in the system, a threshold in the metric, or an interaction between data, prompting and evaluation.</p><p><span class="evidence-source">The central question is not merely whether a score changes rapidly, but whether the evidence supports a distinct underlying transition under comparable conditions.</span></p></section>
        <section id="anchor-background"><h2>2&nbsp;&nbsp;Background</h2><p>Prior work characterizes scaling with empirical curves and task-level evaluations. A binary exact-match metric, for example, may remain at zero until performance crosses a threshold, even when latent competence improves smoothly.</p><div class="paper-figure"><div class="figure-diagram"><div class="figure-node">Model scale</div><div class="figure-node">Latent capability</div><div class="figure-node">Observed metric</div></div><div class="figure-caption"><strong>Figure 1.</strong> Conceptual separation between scale, latent capability and the reported evaluation metric.</div></div></section>
        <section id="anchor-method"><h2>3&nbsp;&nbsp;Method</h2><p>We compare multiple transformations of the same underlying performance signal and retain the task definition, model checkpoints and evaluation examples where possible.</p><p class="formula">m(x) = g(c(x)) + ε</p><p>Here, <em>c(x)</em> denotes a latent capability and <em>g</em> the observation function. This framing does not prove that capabilities are smooth; it exposes what additional evidence is required to distinguish the hypotheses.</p></section></div><div class="pdf-page-number">1</div></article>
        <article class="pdf-page"><div class="pdf-columns pdf-copy"><section id="anchor-result"><h2>4&nbsp;&nbsp;Experiments</h2><p>We evaluate the competing interpretations across tasks and model sizes. <span class="evidence-source">When a continuous score replaces a thresholded metric, several apparent discontinuities become smoother and more predictable.</span> Other tasks retain uncertainty because checkpoints are sparse or the available metric is intrinsically discrete.</p>
          <table class="paper-table" id="anchor-table"><thead><tr><th>Task</th><th>Original metric</th><th>Continuous metric</th><th>Interpretation</th></tr></thead><tbody><tr><td>Task A</td><td>Sharp</td><td>Smooth</td><td>Metric-sensitive</td></tr><tr><td>Task B</td><td>Sharp</td><td>Uncertain</td><td>Insufficient checkpoints</td></tr><tr><td>Task C</td><td>Gradual</td><td>Gradual</td><td>Consistent</td></tr></tbody><caption><strong>Table 2.</strong> Demonstration data for the interaction prototype. Values are not copied from the selected paper.</caption></table>
          <h3>4.2&nbsp;&nbsp;Main results</h3><p><span class="evidence-source">The evidence supports a measurement-sensitive interpretation for a subset of tasks, but does not establish that every reported transition is an artifact.</span> Conclusions must be scoped to the evaluated tasks, checkpoints, prompts and metrics.</p></section>
          <section id="anchor-limit"><h2>5&nbsp;&nbsp;Limitations</h2><p>Our analysis cannot directly observe latent capability, and alternative continuous metrics may introduce their own assumptions. Comparisons across model families remain difficult when training data, prompting and model access differ.</p><p><span class="evidence-source">Absence of a discontinuity under one metric is not proof that no meaningful qualitative change occurs elsewhere.</span></p></section>
          <section><h2>6&nbsp;&nbsp;Discussion</h2><p>${counter?'For the current reading pack, this paper should be treated as a methodological counterpoint rather than a universal refutation.':'For the current reading pack, the paper contributes evidence that should be compared against the assigned counterpoint before accepting a broad interpretation.'}</p></section>
          <section id="anchor-ref"><h2>References</h2><p>[1] Example reference used for the interaction prototype.<br>[2] All visible body text is synthetic and only demonstrates evidence anchors.</p></section>
        </div><div class="pdf-page-number">2</div></article>`;
    }

      return 'emergence';

    function runPackGeneration() {
      const input = document.getElementById('topicInput');
      if (input) state.query = input.value.trim() || currentTheme().label;
      state.themeKey = detectTheme(state.query);
      state.packGenerated = true;
      state.loadingStep = 1;
      renderView();
      let step = 1;
      const timer = setInterval(()=>{
        step += 1; state.loadingStep = step;
        if (step > 6) { clearInterval(timer); state.loadingStep=0; state.query = state.query || currentTheme().label; renderView(); toast('阅读包已生成','已形成基石、当前发展、反方和桥梁；低置信度条目仍需核验。'); }
        else renderView();
      }, 260);
    }

      openModal(`<div class="modal-head"><div><h2>同步预览</h2><p>执行前明确区分 Zotero 写入、本地 Git commit 与 GitHub push。</p></div><button class="icon-button" data-action="close-modal">${ICONS.close}</button></div><div class="modal-body"><div class="sync-plan">
        <div class="plan-group"><div class="plan-group-head">${ICONS.zotero}<strong>Zotero · Library 0</strong><span>2 个变更</span></div><div class="plan-row">${ICONS.check}<div><strong>关联现有顶层条目</strong><span>${esc(paper?.title||'Selected paper')} · 不创建重复条目</span></div></div><div class="plan-row">${ICONS.check}<div><strong>更新 PaperWeave child note</strong><span>只修改 data-paperweave-note="v1" 管理区块；用户笔记不变</span></div></div></div>
        <div class="plan-group"><div class="plan-group-head">${ICONS.git}<strong>Local Git · research-notes/</strong><span>3 个文件</span></div><div class="plan-row">${ICONS.check}<div><strong>papers/${paper?.id||'paper'}/index.md</strong><span>更新 2 条 Verified Claim 和认知卡</span></div></div><div class="plan-row">${ICONS.check}<div><strong>papers/${paper?.id||'paper'}/claims.json</strong><span>结构化对象与 provenance</span></div></div><div class="plan-row">${ICONS.check}<div><strong>topics/${state.themeKey}/index.md</strong><span>更新阅读状态；不导出 PDF</span></div></div></div>
        <div class="diff-box">commit: paperweave: verify notes for ${paper?.id||'paper'}\n\n<span class="diff-add">+ 2 verified claims</span>\n<span class="diff-add">+ 4 evidence anchors</span>\n<span class="diff-add">+ cognitive delta draft</span>\n\nGitHub push: OFF (manual)</div>
      </div></div><div class="modal-foot"><button class="secondary-button" data-action="close-modal">取消</button><button class="primary-button" data-action="execute-sync">执行 Zotero 写入并 Commit</button></div>`);
    }

    function rationaleModal() {
      openModal(`<div class="modal-head"><div><h2>主题范围、覆盖与已知缺口</h2><p>推荐角色是相对于当前阅读包的判断，不是论文永久标签。</p></div><button class="icon-button" data-action="close-modal">${ICONS.close}</button></div><div class="modal-body">
        <div class="field-grid"><div class="guide-card"><strong>主题解释</strong><p style="margin-top:7px">${esc(currentTheme().description)}</p></div><div class="guide-card"><strong>数据源快照</strong><p style="margin-top:7px">OpenAlex：可用 · Crossref：可用 · Semantic Scholar：降级缓存 · Zotero：本地上下文</p></div></div>
        <div class="guide-card"><strong>角色依据</strong><div class="question-list" style="margin-top:8px"><div class="question-item">基石：共同引用祖先、原始贡献、概念起源与当前主题相关性。</div><div class="question-item">前沿：近期相关、引用增长、新聚类中心与可用实验资产。</div><div class="question-item">反方：同一命题、引用语境、方法学批评、负结果或边界条件；不把普通替代方法当反方。</div></div></div>
        <div class="guide-card"><strong>已知缺口</strong><p style="margin-top:7px">部分 2024–2026 条目使用原型演示记录；未核验所有数据源许可与当前全文可用性。真实产品必须显示字段来源、更新时间和置信度。</p></div>
      </div><div class="modal-foot"><button class="primary-button" data-action="close-modal">了解</button></div>`);
    }

    function evidenceModal(proposition) {
      openModal(`<div class="modal-head"><div><h2>命题证据</h2><p>${esc(proposition)}</p></div><button class="icon-button" data-action="close-modal">${ICONS.close}</button></div><div class="modal-body"><div class="review-summary"><div><strong>4 篇论文 · 7 条 Verified Claims</strong><span>“反对”不等于研究对象与设置完全可比</span></div><div class="review-progress">已审阅</div></div>
        ${[['Wei 2022','support','将若干任务曲线描述为随规模出现的非线性能力。','p.4 · Figure 2'],['Schaeffer 2023','qualify','指出离散指标能从平滑潜在能力制造表面断点。','p.6 · Proposition 1'],['Continuous metrics','counter','在替代度量下观察到平滑曲线，但模型族覆盖有限。','p.8 · Table 3']].map(([p,s,t,a])=>`<div class="claim-card accepted"><div class="claim-head"><span class="epistemic">${p}</span><span class="draft-badge accepted">${s}</span></div><p class="claim-text">${t}</p><button class="anchor-chip">${a}</button></div>`).join('')}
      </div><div class="modal-foot"><button class="secondary-button" data-action="close-modal">关闭</button><button class="primary-button" data-action="show-toast" data-toast="已创建一个用户确认命题合并的任务。">审阅命题合并</button></div>`);
    }

    function advancedModal() {
      openModal(`<div class="modal-head"><div><h2>高级主题约束</h2><p>减少歧义而不阻塞生成；系统会把未确定项作为可编辑假设。</p></div><button class="icon-button" data-action="close-modal">${ICONS.close}</button></div><div class="modal-body"><div class="field-grid"><div class="field"><label>时间范围</label><input value="2017–2026"></div><div class="field"><label>论文数量</label><select><option>9–12</option><option>6–8</option><option>12–18</option></select></div><div class="field"><label>偏好</label><select><option>理论与实证平衡</option><option>偏理论</option><option>偏工程</option></select></div><div class="field"><label>全文策略</label><select><option>开放获取优先</option><option>仅 OA</option><option>不限制</option></select></div><div class="field full"><label>排除关键词/作者/venue</label><input placeholder="用逗号分隔"></div><div class="field full"><label>种子论文或 Zotero Collection</label><input value="Zotero / Research / LLM Evaluation"></div></div></div><div class="modal-foot"><button class="secondary-button" data-action="close-modal">取消</button><button class="primary-button" data-action="close-modal">应用约束</button></div>`);
    }

    function showPalette() {
      state.paletteOpen=true;
      const items = [
        ['discover','创建新的平衡阅读包','输入主题、问题或种子论文',ICONS.compass,'N'],
        ['library','打开文献库','搜索 Zotero、本地 PDF 与阅读状态',ICONS.library,'L'],
        ['knowledge','查看主题命题矩阵','比较支持、反对、限定与不可比',ICONS.knowledge,'K'],
        ['sync','预览 Zotero / Git 同步','执行外部写入前检查 diff',ICONS.sync,'S'],
        ['settings','配置模型 Provider','BYOK、任务路由与隐私范围',ICONS.settings,',']
      ];
      document.getElementById('paletteRoot').innerHTML = `<div class="command-backdrop" data-action="palette-backdrop"><div class="command-palette"><input class="command-input" id="commandInput" placeholder="搜索论文、命令或主题…" autofocus><div class="command-results">${items.map(([v,t,s,i,k],idx)=>`<button class="command-item ${idx===0?'active':''}" data-action="command-nav" data-view="${v}">${i}<span><strong>${t}</strong><span>${s}</span></span><kbd>⌘${k}</kbd></button>`).join('')}</div></div></div>`;
      setTimeout(()=>document.getElementById('commandInput')?.focus(),0);
    }
    function closePalette(){state.paletteOpen=false;document.getElementById('paletteRoot').innerHTML='';}

    document.addEventListener('click', e => {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      if (['toggle-pin','replace-paper'].includes(action)) e.stopPropagation();
      if (action==='nav') setView(actionEl.dataset.view);
      else if (action==='generate-pack') runPackGeneration();
      else if (action==='choose-theme') {
        const k=actionEl.dataset.theme;
        if(k==='custom'){state.query='我最近加入 Zotero 的论文形成了哪些主题？';state.themeKey='emergence';}
        else {state.themeKey=k;state.query=THEMES[k].label;}
        state.packGenerated=true; renderView();
      }
      else if (action==='shuffle-theme') { const keys=Object.keys(THEMES); const i=(keys.indexOf(state.themeKey)+1)%keys.length; state.themeKey=keys[i]; state.query=currentTheme().label; renderView(); toast('已换一批','保留角色配比，并对历史结果去重。'); }
      else if (action==='toggle-counterpoint') {state.counterpointOn=!state.counterpointOn;renderView();}
      else if (action==='toggle-oa') {state.oaOnly=!state.oaOnly;renderView();}
      else if (action==='open-paper') openPaper(actionEl.dataset.paper);
      else if (action==='toggle-pin') {const id=actionEl.dataset.paper;state.pinned.has(id)?state.pinned.delete(id):state.pinned.add(id);renderView();}
      else if (action==='replace-paper') {toast('替换候选已生成',`保留 ${ROLE_LABELS[actionEl.dataset.role]} 角色与已固定论文；原型不改变静态条目。`);}
      else if (action==='back-from-reader') {state.view='discover';state.selectedPaper=null;renderView();}
      else if (action==='reader-tab') {state.readerTab=actionEl.dataset.tab;renderView();}
      else if (action==='jump-anchor') jumpAnchor(actionEl.dataset.anchor);
      else if (action==='review-claim') {
        const {paper,claim,status}=actionEl.dataset; state.review[paper] ||= {}; state.review[paper][claim]=status; renderView();
        toast(status==='accepted'?'Claim 已验证':'Claim 已驳回',status==='accepted'?'它现在可进入主题综合与 Git 导出。':'驳回原因可作为本地个性化信号。');
      }
      else if (action==='edit-claim') {state.editingClaim=`${actionEl.dataset.paper}:${actionEl.dataset.claim}`;renderView();}
      else if (action==='cancel-claim-edit') {state.editingClaim=null;renderView();}
      else if (action==='save-claim-edit') {const {paper,claim}=actionEl.dataset;state.review[paper]||={};state.review[paper][claim]='edited';state.editingClaim=null;renderView();toast('用户修订已验证','保留“AI 起草，经用户编辑”的 provenance。');}
      else if (action==='save-zotero') {state.zoteroLinked=true;renderView();toast('已关联 Zotero','原型模拟：匹配现有条目，不创建重复记录。');}
      else if (action==='open-sync-preview') syncPreviewModal();
      else if (action==='execute-sync') {state.gitCommitted=true;state.syncCompleted=true;closeModal();renderView();toast('同步任务完成','Zotero child note 已更新；Git 已本地 commit；未 push GitHub。');}
      else if (action==='close-modal') closeModal();
      else if (action==='backdrop-close' && e.target===actionEl) closeModal();
      else if (action==='open-pack-rationale') rationaleModal();
      else if (action==='advanced-search') advancedModal();
      else if (action==='show-evidence-modal') evidenceModal(actionEl.dataset.proposition);
      else if (action==='settings-tab') {state.settingsTab=actionEl.dataset.tab;renderView();}
      else if (action==='toggle-setting') {actionEl.classList.toggle('on');}
      else if (action==='test-model') toast('连接与能力检测通过','支持 streaming、JSON schema、vision；这是原型模拟结果。');
      else if (action==='save-settings') toast('设置已保存','真实产品会把密钥保存到 PaperWeave 本机配置，之后可替换或清除。');
      else if (action==='show-toast') toast('原型提示',actionEl.dataset.toast||'操作已记录。');
      else if (action==='ask-suggestion') {const input=document.getElementById('askInput');if(input){input.value=actionEl.dataset.question;input.focus();}}
      else if (action==='ask-submit') {
        const input=document.getElementById('askInput');const q=input?.value.trim();if(!q)return;
        const id=state.selectedPaper; state.chats[id] ||= []; state.chats[id].push({role:'user',text:q},{role:'ai',text:'这篇论文更直接限定的是“观察指标能否证明离散相变”，而不是证明所有能力变化都必然平滑。正文同时保留了对未覆盖任务和不同模型族的谨慎范围。'}); renderView();
      }
      else if (action==='command-nav') {const v=actionEl.dataset.view;closePalette();if(v==='sync')syncPreviewModal();else setView(v);}
      else if (action==='palette-backdrop' && e.target===actionEl) closePalette();
    });

    document.addEventListener('input', e => {
      if (e.target.id==='userNotes') {state.userNotes[e.target.dataset.paper]=e.target.value;}
      if (e.target.id==='globalSearchInput' && e.target.value.trim()) showPalette();
    });

    document.addEventListener('keydown', e => {
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') {e.preventDefault();state.paletteOpen?closePalette():showPalette();}
      if (e.key==='Escape') {closeModal();closePalette();}
      if (e.key==='Enter' && e.target.matches('.paper-card,.supplement-card')) openPaper(e.target.dataset.paper);
    });

    renderView();
  </script>
</body>
</html>
