name: knowledge-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""
      - name: Verify generated files and knowledge invariants
        run: python3 scripts/lab.py check
      - name: Run automation tests
        run: python3 -m unittest discover -s tests -v
