name: Selective reproduction
description: Propose a bounded reproduction only when reading is insufficient.
title: "[Reproduction] "
labels: [reproduction]
body:
  - type: textarea
    id: unresolved
    attributes:
      label: What reading cannot resolve
      description: Name the specific claim that requires practical verification.
    validations:
      required: true
  - type: textarea
    id: minimum
    attributes:
      label: Minimum experiment
      description: Keep the first step within one hour and zero API cost.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: This does not require a paid API or repository secret.
          required: true
        - label: This will not displace the week's reading commitment.
          required: true
